  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="רשימת קניות חכמה">
  <meta property="og:description" content="אפליקציית רשימת קניות בעברית עם מחירים ושיתוף">

  <style>
    /* Force compact size for the Save Store selection button */
    #btnSaveStore {
      font-size: 0.82rem !important;
      padding: 0.32rem 0.6rem !important;
      line-height: 1.1;
      border-radius: 6px;
    }
    /* Stack price toggle above Save button */
    .store-controls { display: flex; flex-direction: column; align-items: flex-start; gap: 0.35rem; }
  </style>

</head>
<body>
  <!-- Share Modal -->
  <div id="shareModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:400px;text-align:center;position:relative;">
      <span class="close-modal" id="closeShareModal" style="position:absolute;top:0.3em;right:0.3em;font-size:1.5em;cursor:pointer;z-index:10;background:rgba(255,255,255,0.7);border-radius:50%;width:1.4em;height:1.4em;line-height:1.4em;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:0;text-align:center;">&times;</span>
      <h2 style="margin-top:1.2em;">קישור לשיתוף הרשימה</h2>
      <input id="shareLinkInput" type="text" readonly style="width:90%;font-size:1.1em;padding:0.4em;margin:1em 0;direction:ltr;" aria-label="קישור לשיתוף הרשימה" />
      <div style="display:flex;flex-direction:column;gap:0.8em;margin-top:1em;">
        <button id="copyShareLinkBtn" class="btn-action share-modal-btn" aria-label="העתק את הקישור ללוח">📋 העתק קישור</button>
        <button id="smsShareBtn" class="btn-action share-modal-btn" aria-label="שלח את הקישור ב-SMS">📱 שלח ב-SMS</button>
        <button id="waShareBtn" class="btn-action share-modal-btn" style="background:#25d366;color:#fff;" aria-label="שתף את הקישור ב-WhatsApp">🟢 שתף ב-WhatsApp</button>
      </div>
      <div id="copyStatus" style="margin-top:0.5em;color:green;font-size:0.95em;"></div>
    </div>
  </div>
  <header class="app-header">
    <h1>רשימת קניות</h1>
    <div class="header-controls">
  <div class="menu-container">
  <button id="menuButton" class="header-btn menu-icon icon-menu" title="תפריט והגדרות" aria-label="תפריט והגדרות"></button>
      <div id="menuDropdown" class="menu-dropdown">
        <button class="dropdown-close icon-close" aria-label="סגור"></button>
        
        <!-- קטגוריה: תצוגה -->
        <div class="menu-section">
          <div class="menu-section-title">👁️ תצוגה</div>
          <button id="btnViewMode" class="menu-item">🌙☀️ מצב לילה/יום</button>
          <button id="btnFontIncrease" class="menu-item">🔼 הגדל פונט</button>
          <button id="btnFontDecrease" class="menu-item">🔽 הקטן פונט</button>
          <button id="btnFontReset" class="menu-item">↩️ פונט ברירת מחדל</button>
          <label class="menu-item toggle-item" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
            <span>🖼️ הצג תמונות</span>
            <input type="checkbox" id="toggleImages" checked style="width:auto;">
          </label>
          <!-- PhotoPrism sync buttons removed - using emojis only -->
        </div>

        <!-- קטגוריה: ניהול פריטים -->
        <!-- Removed: Items management section - no longer needed with + buttons in categories -->

        <!-- קטגוריה: פעולות על הרשימה -->
        <!-- Removed: Actions moved to list menu next to "הרשימה שלי" -->



        <!-- קטגוריה: הגדרות מתקדמות -->
        <div class="menu-section">
          <div class="menu-section-title">⚙️ הגדרות</div>
        <!-- Store selector and price toggle (הדבק בתוך ה-header או settings) -->
<div id="storeSelector" class="store-selector">
  <div class="store-group">
    <label for="networkSelect">רשת</label>
    <select id="networkSelect">
      <option value="">(לא נבחר)</option>
      <option value="yohananof">יוחננוף</option>
      <option value="shufersal">שופרסל</option>
      <option value="rami">רמי לוי</option>
    </select>
  </div>

  <div class="store-group">
    <label for="branchSelect">סניף</label>
    <select id="branchSelect">
      <option value="">(לא נבחר)</option>
    </select>
  </div>

  <div class="store-controls">
    <label class="price-toggle">
      <input type="checkbox" id="togglePrices">
      <span class="toggle-label">הצג מחירים</span>
    </label>
    <button id="btnSaveStore" class="btn">שמור בחירה</button>
    <!-- Emergency clean button (hidden by default, appears on long-press) -->
    <button id="btnEmergencyClean" class="btn btn-emergency" style="display:none; background-color: #ff6b6b; color: white; margin-top: 8px;" title="ניקוי חירום של נתונים פגומים">
      🧹 ניקוי יסודי
    </button>
  </div>
</div>
        </div>
      </div>
      </div>
    </div>
  </header>

  <main class="app-content">
    <!-- Button to open choose modal -->
    <div class="choose-modal-trigger">
      <button id="btnOpenChooseModal" class="btn-open-choose" aria-label="פתח חלון קטגוריות">
        קטגוריות
      </button>
      <button id="btnToggleDarkMode" class="btn-dark-toggle" aria-label="מעבר בין מצב יום ולילה" title="מצב לילה">
        🌙
      </button>
    </div>

    <section id="listSection">
      <div class="list-header">
  <h2>📃 הרשימה שלי</h2>
  <button id="btnShareList" class="btn-action" title="שתף רשימה בענן" aria-label="שתף את הרשימה דרך Firebase">
  <img src="icons/share_icon2.png" alt="שתף רשימה" style="width:3.2em;height:3.2em;filter:drop-shadow(0 0 2px #fff);transition:transform 0.12s;">
  </button>
  <button id="btnListClear" class="header-btn" style="background:#ff6b6b;color:white;padding:0.5em 1em;border-radius:8px;border:none;cursor:pointer;margin-left:0.5rem;" title="נקה רשימה" aria-label="נקה רשימה">🗑️</button>
      </div>
      
      <div class="add-item-inline" id="addItemList">
        <input type="text" placeholder="➕ הוסף פריט לרשימה..." class="add-item-input" id="addItemListInput" aria-label="הוסף פריט חדש לרשימה">
        <button id="btnVoiceInput" class="voice-input-btn" title="הוסף בדיבור" aria-label="הוסף פריט באמצעות זיהוי קולי">🎤</button>
      </div>
      <div id="listGrid"></div>
      <div id="listFooter" class="list-footer">
        <div class="total-row">
          <span class="total-label">סה"כ:</span>
          <span id="totalAmount" class="total-amount">₪ 0</span>
        </div>
      </div>
      
    </section>

    <!-- Cart Section for Purchased Items -->
    <section id="cartSection" style="display:none;">
      <div>
        <div class="list-header">
          <h2>🛒 עגלה</h2>
          <button id="btnClearCart" class="clear-cart-btn" title="נקה עגלה">נקה עגלה</button>
        </div>
        <div id="cartGrid"></div>
        <div class="cart-total">
          <span>סה"כ עגלה:</span>
          <span id="cartTotalAmount">₪ 0</span>
        </div>
      </div>
    </section>

    <!-- Context Menu for List Items -->
    <div id="itemContextMenu" class="context-menu" style="display:none;">
      <button id="contextEdit" class="context-menu-btn">✏️ ערוך</button>
      <button id="contextIcon" class="context-menu-btn">🎨 שנה אייקון</button>
      <button id="contextDelete" class="context-menu-btn delete">🗑️ מחק</button>
      <button id="contextSelect" class="context-menu-btn select">☑️ בחר</button>
      <button id="contextCancel" class="context-menu-btn">❌ ביטול</button>
    </div>
    
    <!-- Selection Mode Toolbar -->
    <div id="selectionToolbar" class="selection-toolbar" style="display:none;">
      <button id="btnSelectAll" class="context-menu-btn">✅ בחר הכל</button>
      <button id="btnDeselectAll" class="context-menu-btn">⬜ בטל בחירה</button>
      <button id="btnDeleteSelected" class="context-menu-btn delete">🗑️ מחק נבחרים (<span id="selectedCount">0</span>)</button>
      <button id="btnCancelSelection" class="context-menu-btn">❌ ביטול</button>
    </div>

    <!-- Custom Prompt Modal -->
    <div id="customPromptModal" class="modal" style="display:none;">
      <div class="modal-content" style="max-width:90vw; width:100%; max-width:600px;">
        <span class="close-modal" id="closeCustomPrompt">&times;</span>
        <h2 class="modal-title" id="customPromptTitle">הכנס ערך</h2>
        <p id="customPromptMessage" style="margin-bottom:1rem;text-align:right;"></p>
        <input type="text" id="customPromptInput" class="custom-prompt-input" style="width:100%;max-width:100%;box-sizing:border-box;padding:0.7rem;font-size:1rem;border:2px solid #ddd;border-radius:8px;text-align:right;direction:rtl;margin-bottom:1rem;">
        <div style="display:flex;gap:0.5rem;justify-content:center;">
          <button id="customPromptCancel" class="btn" style="background:#e0e0e0;color:#333;">ביטול</button>
          <button id="customPromptOk" class="btn" style="background:#6366f1;color:white;">אישור</button>
        </div>
      </div>
    </div>

    <!-- Icon Picker Modal -->
    <div id="iconPickerModal" class="modal" style="display:none;">
      <div class="modal-content icon-picker-content">
        <span class="close-modal" id="closeIconPicker">&times;</span>
        <h2 class="modal-title">בחר אייקון</h2>
        <div class="icon-search-container">
          <input type="text" id="iconSearch" class="icon-search-input" placeholder="🔍 חפש אייקון...">
        </div>
        <div class="icon-upload-container">
          <input type="file" id="iconImageUpload" accept="image/*" style="display:none;">
          <button id="btnUploadImage" class="btn-upload-image">📷 העלה תמונה אישית</button>
          <div class="url-input-container" style="margin-top: 0.5rem;">
            <input type="url" id="iconUrlInput" class="icon-url-input" placeholder="🌐 הכנס קישור לתמונה מהרשת...">
            <button id="btnUseUrl" class="btn-use-url">✓ השתמש</button>
          </div>
        </div>
        <div id="iconGrid" class="icon-grid"></div>
      </div>
    </div>



    <!-- Choose Items Modal -->
    <div id="chooseItemsModal" class="modal" style="display:none;">
      <div class="modal-content choose-items-modal-content">
        <span class="close-modal" id="closeChooseModal">&times;</span>
        <h2 class="modal-title">בחר פריט</h2>
        <div class="choose-search-container">
          <input type="text" id="chooseSearch" class="choose-search-input" placeholder="🔍 חפש פריט...">
        </div>
        <div id="chooseGrid" class="choose-grid"></div>
        <div class="add-item-inline-modal">
          <input type="text" placeholder="➕ הוסף פריט חדש..." class="add-item-input" id="addItemChooseInput">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer removed - all actions moved to menu -->

  <script>
    (function(){
      const btn = document.getElementById('fontMenuButton');
      const dd = document.getElementById('fontDropdown');
      if (btn && dd) {
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          dd.style.display = (dd.style.display === 'block') ? 'none' : 'block';
        });
      }
      document.addEventListener('click', function(e){
        if (!e.target.closest('.font-menu-container')) {
          if (dd) dd.style.display = 'none';
        }
      });
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
  </body>
</html>
